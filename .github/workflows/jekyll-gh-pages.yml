# Validate the complete developer-documentation site and deploy main to GitHub Pages.
name: Deploy Docs

on:
  push:
    branches: ["main"]

  # Run the production-equivalent build before documentation or API changes merge.
  pull_request:

  workflow_dispatch:

# Pull-request and build code receives read-only repository access.
permissions:
  contents: read

# Cancel superseded pull-request checks, but never interrupt a production deployment.
concurrency:
  group: "docs-${{ github.event.pull_request.number || 'deployment' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile
      BUNDLE_FROZEN: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --- PHP API Docs ---
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, dom
          tools: composer:v2

      # --- JavaScript API Docs ---
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Validate handwritten documentation
        working-directory: app
        run: npm run docs:check

      - name: Generate and validate API docs
        run: bash generate_api_docs.sh

      # --- Jekyll Build ---
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build with locked Jekyll dependencies
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --source docs --destination _site --trace

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
