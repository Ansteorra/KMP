name: Turbo / Verified image transport

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: nightly-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ansteorra/kmp

jobs:
  quality-gate-evidence:
    if: github.event_name != 'workflow_dispatch' || github.ref_name != 'codex/turbo-image-export'
    name: Verify branch quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require successful gates for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            main|dev) ;;
            *) echo "Candidate builds require official main or dev." >&2; exit 1 ;;
          esac
          .github/scripts/require-workflow-success.sh tests.yml "$GITHUB_SHA" "$GITHUB_REF_NAME" push

  build-and-push:
    needs: [quality-gate-evidence]
    if: needs.quality-gate-evidence.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.tags.outputs.primary }}
      image: ghcr.io/ansteorra/kmp@${{ steps.build.outputs.digest }}
      live-image: ghcr.io/ansteorra/kmp-live@${{ steps.live-build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy production dockerignore
        run: cp docker/.dockerignore.prod .dockerignore

      - name: Set app semantic version
        id: app-version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            BASE_VERSION="$(tr -d '\r\n' < app/config/version.txt)"
            BASE_VERSION="${BASE_VERSION#v}"
            MAJOR="$(echo "$BASE_VERSION" | cut -d. -f1)"
            MINOR="$(echo "$BASE_VERSION" | cut -d. -f2)"
            if [[ ! "$MAJOR" =~ ^[0-9]+$ ]]; then MAJOR="0"; fi
            if [[ ! "$MINOR" =~ ^[0-9]+$ ]]; then MINOR="0"; fi
            APP_VERSION="${MAJOR}.${MINOR}.${GITHUB_RUN_NUMBER}"
          else
            APP_VERSION="$(
              awk '/^## KMP [0-9]+\.[0-9]+(\.[0-9]+)? / { print $3; exit }' app/CHANGELOG.md
            )"
            if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "Unable to resolve the release candidate version from app/CHANGELOG.md" >&2
              exit 1
            fi
          fi
          echo "$APP_VERSION" > app/config/version.txt
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Determine tags
        id: tags
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          SHORT_SHA=${GITHUB_SHA::7}
          APP_VERSION="${{ steps.app-version.outputs.app_version }}"
          TAGS=""

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            TAGS="nightly-${DATE},nightly,nightly-${APP_VERSION}"
            PRIMARY="nightly-${DATE}"
            CHANNEL="nightly"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            TAGS="dev-${SHORT_SHA},dev,dev-${APP_VERSION}"
            PRIMARY="dev-${SHORT_SHA}"
            CHANNEL="release"
          else
            # workflow_dispatch: both sets
            TAGS="nightly-${DATE},nightly,nightly-${APP_VERSION},dev-${SHORT_SHA},dev,dev-${APP_VERSION}"
            PRIMARY="dev-${SHORT_SHA}"
            CHANNEL="release"
          fi

          # Build full image refs
          FULL_TAGS=""
          IFS=',' read -ra PARTS <<< "$TAGS"
          for t in "${PARTS[@]}"; do
            FULL_TAGS="${FULL_TAGS}${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${t}"$'\n'
          done

          {
            echo "primary=${PRIMARY}"
            echo "channel=${CHANNEL}"
            printf 'tags<<EOF\n%sEOF\n' "$FULL_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.prod
          # Native OS updates must run for each publishable candidate.
          no-cache-filters: runtime-base
          # Azure deployments use AMD64; local development builds its own image.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.app_version }}
            RELEASE_CHANNEL=${{ steps.tags.outputs.channel }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=kmp-app
          cache-to: type=gha,mode=max,scope=kmp-app

      - name: Match gateway tags to the web candidate
        id: live-tags
        env:
          WEB_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo 'tags<<EOF'
            while IFS= read -r tag; do
              [[ -z "$tag" ]] || echo "ghcr.io/ansteorra/kmp-live:${tag##*:}"
            done <<< "$WEB_TAGS"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the matching live gateway
        id: live-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.live
          platforms: linux/amd64
          push: true
          tags: ${{ steps.live-tags.outputs.tags }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=kmp-live
          cache-to: type=gha,mode=max,scope=kmp-live

  candidate-security:
    needs: build-and-push
    uses: ./.github/workflows/security.yml
    with:
      image: ${{ needs.build-and-push.outputs.image }}

  gateway-security:
    needs: build-and-push
    uses: ./.github/workflows/live-updates.yml
    with:
      image: ${{ needs.build-and-push.outputs.live-image }}

  smoke-test:
    needs: [build-and-push, candidate-security, gateway-security]
    if: needs.build-and-push.result == 'success' && needs.candidate-security.result == 'success' && needs.gateway-security.result == 'success'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kmp_test
          POSTGRES_USER: kmpuser
          POSTGRES_PASSWORD: kmppass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kmpuser -d kmp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify bounded PHP capacity and /health
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"
          python3 docker/test-apache-capacity.py --image "$IMAGE"

          docker run -d --name kmp-smoke \
            --network host \
            -e KMP_DB_DRIVER=postgres \
            -e KMP_SKIP_MIGRATIONS=true \
            -e KMP_SKIP_CRON=true \
            -e CACHE_ENGINE=apcu \
            -e KMP_SESSION_DEFAULTS=php \
            -e DEBUG=false \
            -e DATABASE_URL=postgres://kmpuser:kmppass@127.0.0.1:5432/kmp_test \
            -e SECURITY_SALT=ci-nightly-smoke-test-salt \
            "$IMAGE"

          HEALTH=""
          for i in $(seq 1 30); do
            if HEALTH=$(curl -fsS http://localhost/health); then
              echo ""
              echo "Health check passed"
              echo "Health response: $HEALTH"
              exit 0
            fi
            if [ "$i" -eq 30 ]; then
              echo "Health check failed after 30 attempts"
              echo "Last health response: $HEALTH"
              docker logs kmp-smoke
              exit 1
            fi
            echo "Waiting for app... ($i/30)"
            sleep 5
          done

      - name: Smoke test the matching gateway image
        env:
          LIVE_IMAGE: ${{ needs.build-and-push.outputs.live-image }}
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/live-test-key.pem" 2>/dev/null
          export KMP_LIVE_PUBLIC_KEY="$(openssl pkey -in "$RUNNER_TEMP/live-test-key.pem" -pubout 2>/dev/null)"
          docker run -d --name kmp-live-smoke --network host \
            -e PORT=9080 -e REDIS_URL=redis://127.0.0.1:6379 \
            -e KMP_LIVE_ALLOWED_ORIGINS=https://tenant.example.test \
            -e KMP_LIVE_PUBLIC_KEY "$LIVE_IMAGE"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9080/health; then exit 0; fi
            sleep 2
          done
          echo 'Gateway failed readiness.' >&2
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f kmp-smoke kmp-live-smoke 2>/dev/null || true

  export-images:
    name: Export verified candidate images (read only)
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/turbo-image-export'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPORT_RUN_ID: '42331401307'
      EXPECTED_CANDIDATE_SHA: 82bfe782c8363c774e838e1b7abae76d8c94a54b
    steps:
    - name: Resolve only the successful official candidate pair
      run: |-
        set -euo pipefail
        umask 077
        python3 - <<'PY'
        import json,os,re,subprocess
        from pathlib import Path
        repo=os.environ['GITHUB_REPOSITORY']
        assert repo=='Ansteorra/KMP'
        run_id=os.environ['EXPORT_RUN_ID']
        assert run_id=='42331401307'
        sha=os.environ['EXPECTED_CANDIDATE_SHA']
        run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}'],text=True))
        assert run['head_sha']==sha and run['head_branch']=='dev' and run['event']=='push'
        assert run['status']=='completed' and run['conclusion']=='success'
        assert run['path']=='.github/workflows/nightly.yml'
        root=Path(os.environ['IMAGE_EXPORT_ROOT']);root.mkdir(mode=0o700)
        evidence=Path(os.environ['RUNNER_TEMP'])/'image-source-evidence'
        pair={'commit':sha,'sourceRunId':int(run_id),'transport':'dir','images':{}}
        for key,package,artifact in [('web','kmp','security-evidence-amd64'),('gateway','kmp-live','live-gateway-security')]:
            folder=evidence/key
            subprocess.run(['gh','run','download',run_id,'--repo',repo,'--name',artifact,'--dir',str(folder)],check=True)
            reports=list(folder.rglob('image.json'));assert len(reports)==1
            report=json.loads(reports[0].read_text());ref=report['ArtifactName']
            prefix='ghcr.io/ansteorra/'+package+'@sha256:'
            assert ref.startswith(prefix) and re.fullmatch('[0-9a-f]{64}',ref[len(prefix):])
            pair['images'][key]={'source':ref,'directory':key,'imageId':report.get('Metadata',{}).get('ImageID')}
        (root/'images.json').write_text(json.dumps(pair,indent=2))
        print('Resolved the exact audited pair for '+sha)
        PY
      env:
        IMAGE_EXPORT_ROOT: ${{ runner.temp }}/kmp-image-export
    - name: Copy exact image digests without building or publishing
      run: |-
        set -euo pipefail
        umask 077
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends skopeo
        export KMP_EXPORT_AUTH="$RUNNER_TEMP/kmp-registry-auth.json"
        printf '%s' "$GH_TOKEN" | skopeo login --authfile "$KMP_EXPORT_AUTH" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
        python3 - <<'PY'
        import hashlib,json,os,subprocess
        from pathlib import Path
        root=Path(os.environ['IMAGE_EXPORT_ROOT']);pair=json.loads((root/'images.json').read_text())
        auth=os.environ['KMP_EXPORT_AUTH']
        for key,image in pair['images'].items():
            ref=image['source']
            config=json.loads(subprocess.check_output(['skopeo','inspect','--config','--authfile',auth,'docker://'+ref],text=True))
            assert config['config']['Labels']['org.opencontainers.image.revision']==pair['commit']
            destination=root/image['directory']
            subprocess.run(['skopeo','copy','--all','--preserve-digests','--src-authfile',auth,'docker://'+ref,'dir:'+str(destination)],check=True)
            digest='sha256:'+hashlib.sha256((destination/'manifest.json').read_bytes()).hexdigest()
            assert digest==ref.split('@')[1], 'Export changed the audited manifest bytes'
            image['revision']=pair['commit']
        (root/'images.json').write_text(json.dumps(pair,indent=2))
        checks=[]
        for file in sorted(root.rglob('*')):
            if file.is_file():
                value=hashlib.file_digest(file.open('rb'),'sha256').hexdigest()
                checks.append(value+'  '+str(file.relative_to(root)))
        (root/'SHA256SUMS').write_text('\n'.join(checks)+'\n')
        print('Both immutable manifests and source revisions verified; no image was rebuilt or published.')
        PY
      env:
        IMAGE_EXPORT_ROOT: ${{ runner.temp }}/kmp-image-export
    - name: Retain temporary verified image transport
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: verified-turbo-images-82bfe782
        path: ${{ runner.temp }}/kmp-image-export
        compression-level: 0
        retention-days: 1
        if-no-files-found: error
    - name: Remove temporary registry credential
      if: always()
      run: rm -f "$RUNNER_TEMP/kmp-registry-auth.json"
