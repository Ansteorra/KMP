name: Nightly / UAT Verification

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to verify for nightly/UAT promotion
        required: false
        default: main

concurrency:
  group: nightly-uat-verification-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  verify-bundle:
    name: Verification bundle
    runs-on: ubuntu-latest

    services:
      database:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: kmp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d kmp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4.27'
          extensions: mbstring, intl, pdo_pgsql, gd, apcu, grpc, protobuf, yaml
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Create test .env
        run: |
          printf "%s\n" \
            "export KMP_ENV='ci'" \
            "export CACHE_ENGINE='apcu'" \
            "export KMP_SESSION_DEFAULTS='php'" \
            "export KMP_DB_DRIVER='postgres'" \
            "export DB_USERNAME='root'" \
            "export DB_PASSWORD='root'" \
            "export DB_NAME='kmp'" \
            "export EMAIL_SMTP_HOST='localhost'" \
            "export EMAIL_SMTP_PORT='1025'" \
            "export EMAIL_SMTP_USERNAME=''" \
            "export EMAIL_SMTP_PASSWORD=''" \
            > app/config/.env

      - name: Create app_local.php
        run: |
          cat > app/config/app_local.php << 'APPLOCAL'
          <?php
          return [
              'debug' => true,
              'Security' => [
                  'salt' => env('SECURITY_SALT', 'ci-test-salt-not-for-production-use-only-for-ci'),
              ],
              'Datasources' => [
                  'default' => [
                      'driver' => \Cake\Database\Driver\Postgres::class,
                      'host' => '127.0.0.1',
                      'port' => '5432',
                      'username' => env('DB_USERNAME'),
                      'password' => env('DB_PASSWORD'),
                      'database' => env('DB_NAME'),
                      'url' => env('DATABASE_URL', null),
                  ],
                  'test' => [
                      'driver' => \Cake\Database\Driver\Postgres::class,
                      'host' => '127.0.0.1',
                      'port' => '5432',
                      'username' => env('DB_USERNAME'),
                      'password' => env('DB_PASSWORD'),
                      'database' => env('DB_NAME') . '_test',
                      'url' => env('DATABASE_URL', null),
                  ],
              ],
              'EmailTransport' => [
                  'default' => [
                      'host' => 'localhost',
                      'port' => 1025,
                      'username' => null,
                      'password' => null,
                      'client' => null,
                      'url' => env('EMAIL_TRANSPORT_DEFAULT_URL', null),
                  ],
              ],
          ];
          APPLOCAL

      - name: Install Composer dependencies
        run: cd app && composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: cd app && npm ci --no-audit --no-fund

      - name: Run verification bundle
        run: |
          set -o pipefail
          mkdir -p test-results
          cd app
          bash bin/verify.sh | tee ../test-results/verify.log

      - name: Upload verification logs
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-bundle-logs
          path: test-results/verify.log

  playwright-uat:
    name: Playwright UAT regression
    needs: verify-bundle
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: http://kmp.localhost:8080
      PLAYWRIGHT_MAILPIT_URL: http://127.0.0.1:8025
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      PLAYWRIGHT_INCLUDE_DESTRUCTIVE: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4.27'
          extensions: mbstring, intl, pdo_pgsql, gd, apcu, grpc, protobuf, yaml
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create test .env
        run: |
          printf "%s\n" \
            "export KMP_ENV='ci'" \
            "export CACHE_ENGINE='apcu'" \
            "export KMP_SESSION_DEFAULTS='php'" \
            "export PLAYWRIGHT_USE_DOCKER_PHP='1'" \
            "export KMP_RESET_DB_ON_UP='false'" \
            "export KMP_SKIP_INITIAL_DB_SETUP='true'" \
            "export KMP_APP_URL='http://127.0.0.1:8080/livez'" \
            "export KMP_HOST_ALIASES='kmp.localhost kmp2.localhost'" \
            "export KMP_DB_DRIVER='postgres'" \
            "export POSTGRES_USER='KMPSQLDEV'" \
            "export POSTGRES_PASSWORD='kmpdevpass'" \
            "export POSTGRES_DB='KMP_DEV'" \
            "export PLATFORM_DB_DATABASE='KMP_PLATFORM'" \
            "export KMP_TENANCY_ENABLED='true'" \
            "export EMAIL_SMTP_HOST='mailpit'" \
            "export EMAIL_SMTP_PORT='1025'" \
            "export EMAIL_SMTP_USERNAME=''" \
            "export EMAIL_SMTP_PASSWORD=''" \
            > app/config/.env

      - name: Create host app config
        run: printf "<?php\nreturn [];\n" > app/config/app_local.php

      - name: Install Composer dependencies
        run: cd app && composer install --no-interaction --prefer-dist

      - name: Prepare CI runtime
        run: chmod 0755 app/tmp

      - name: Install Node dependencies
        run: cd app && npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: cd app && npm run dev

      - name: Build Docker test image
        run: docker build --file docker/Dockerfile.ci --tag kmp-app:dev .

      - name: Start Docker test services
        run: |
          echo "127.0.0.1 kmp.localhost kmp2.localhost" | sudo tee -a /etc/hosts
          for volume in kmp-pg-data kmp-composer-cache kmp-node-modules kmp-pgadmin-data; do
            docker volume create "$volume" >/dev/null
          done
          docker compose --env-file app/config/.env up -d --no-build app mailpit

      - name: Install Playwright browser
        run: cd app && npx playwright install --with-deps chromium

      - name: Run Playwright UAT regression
        run: |
          bash reset_dev_database.sh
          docker compose --env-file app/config/.env up -d --no-build scheduler
          cd app
          PLAYWRIGHT_RESET_DB=0 npm run test:ui:uat

      - name: Upload Playwright UAT artifacts
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-uat-artifacts
          path: |
            app/tests/ui-reports
            app/tests/ui-results

      - name: Show Docker logs
        if: failure()
        run: docker compose --env-file app/config/.env logs --no-color --tail=200 app scheduler db

      - name: Stop Docker test environment
        if: always()
        run: docker compose --env-file app/config/.env down
