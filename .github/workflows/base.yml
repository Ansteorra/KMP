name: Build KMP Base Image

# Triggers when the base image definition changes, or manually.
# Publishes the AMD64 base used by Dockerfile.ci. Production builds refresh
# their runtime directly; local development builds a separate image.
on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.base'
      - 'docker/install-runtime.sh'
  workflow_dispatch:
  schedule:
    - cron: '7 4 * * 1'

concurrency:
  group: kmp-base-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/ansteorra/kmp-base

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.base
          no-cache: ${{ github.event_name == 'schedule' }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:php84
            ${{ env.BASE_IMAGE }}:latest
          # Dedicated cache scope so app builds don't pollute it
          cache-from: type=gha,scope=kmp-base
          cache-to: type=gha,mode=max,scope=kmp-base
