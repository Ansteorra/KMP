name: Azure / Deploy Container Apps

on:
  workflow_call:
    inputs:
      environment_name:
        description: GitHub environment that owns the Azure configuration
        required: true
        type: string
      source_image:
        description: Immutable GHCR image reference ending in @sha256:digest
        required: true
        type: string
      source_live_image:
        description: Matching immutable gateway image from the same candidate
        required: true
        type: string
      target_tag:
        description: Tag to create in the environment ACR
        required: true
        type: string
      checkout_ref:
        description: Trusted ref containing the deployment tooling
        required: false
        default: main
        type: string

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ steps.endpoint.outputs.url }}
    concurrency:
      group: azure-${{ inputs.environment_name }}-deploy
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
      SOURCE_IMAGE: ${{ inputs.source_image }}
      SOURCE_LIVE_IMAGE: ${{ inputs.source_live_image }}
      TARGET_TAG: ${{ inputs.target_tag }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_POSTGRES_RESOURCE_GROUP: ${{ vars.AZURE_POSTGRES_RESOURCE_GROUP }}
      AZURE_POSTGRES_SERVER_NAME: ${{ vars.AZURE_POSTGRES_SERVER_NAME }}
      AZURE_WEB_APP_NAME: ${{ vars.AZURE_WEB_APP_NAME }}
      AZURE_LIVE_APP_NAME: ${{ vars.AZURE_LIVE_APP_NAME }}
      LIVE_UPDATES_ENABLED: ${{ vars.KMP_LIVE_UPDATES_ENABLED || 'false' }}
      AZURE_MIGRATE_JOB_NAME: ${{ vars.AZURE_MIGRATE_JOB_NAME }}
      AZURE_QUEUE_JOB_NAME: ${{ vars.AZURE_QUEUE_JOB_NAME }}
      AZURE_ADMIN_JOB_NAME: ${{ vars.AZURE_ADMIN_JOB_NAME }}
      AZURE_RESTORE_JOB_NAME: ${{ vars.AZURE_RESTORE_JOB_NAME }}
      AZURE_PROVISION_JOB_NAME: ${{ vars.AZURE_PROVISION_JOB_NAME }}
      AZURE_SCHED_HOURLY_JOB_NAME: ${{ vars.AZURE_SCHED_HOURLY_JOB_NAME }}
      AZURE_SCHED_DAILY_JOB_NAME: ${{ vars.AZURE_SCHED_DAILY_JOB_NAME }}
      AZURE_SCHED_WEEKLY_JOB_NAME: ${{ vars.AZURE_SCHED_WEEKLY_JOB_NAME }}
      AZURE_SCHED_NIGHTLY_JOB_NAME: ${{ vars.AZURE_SCHED_NIGHTLY_JOB_NAME }}

    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Validate deployment inputs
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          set -euo pipefail
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP \
            AZURE_ACR_NAME \
            AZURE_POSTGRES_RESOURCE_GROUP \
            AZURE_POSTGRES_SERVER_NAME \
            AZURE_WEB_APP_NAME \
            AZURE_MIGRATE_JOB_NAME \
            AZURE_QUEUE_JOB_NAME \
            AZURE_ADMIN_JOB_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required $DEPLOY_ENVIRONMENT environment variable: $name" >&2
              exit 64
            fi
          done
          if [[ ! "$TARGET_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid ACR target tag: $TARGET_TAG" >&2
            exit 64
          fi
          bash deploy/azure/test-runtime-contract.sh

      - name: Azure login with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify deployed database job isolation
        run: python3 deploy/azure/check-database-job-contract.py --azure

      - name: Allow PostgreSQL text search extensions
        run: |
          bash deploy/azure/ensure-postgres-extension.sh \
            --resource-group "$AZURE_POSTGRES_RESOURCE_GROUP" \
            --server-name "$AZURE_POSTGRES_SERVER_NAME" \
            --extension CITEXT
          bash deploy/azure/ensure-postgres-extension.sh \
            --resource-group "$AZURE_POSTGRES_RESOURCE_GROUP" \
            --server-name "$AZURE_POSTGRES_SERVER_NAME" \
            --extension UNACCENT

      - name: Import the tested image into ACR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo 'Only a verified immutable source image may be deployed.' >&2
            exit 64
          fi
          ACR_LOGIN_SERVER="$(az acr show --name "$AZURE_ACR_NAME" --query loginServer --output tsv)"
          for pair in "kmp=$SOURCE_IMAGE" "kmp-live=$SOURCE_LIVE_IMAGE"; do
            repository="${pair%%=*}"
            source="${pair#*=}"
            [[ "$source" =~ @sha256:[0-9a-f]{64}$ ]] || { echo 'Both candidate images must be immutable.' >&2; exit 64; }
            source_digest="${source##*@}"
            existing="$(az acr manifest show-metadata --registry "$AZURE_ACR_NAME" \
              --name "$repository:$TARGET_TAG" --query digest --output tsv 2>/dev/null || true)"
            if [[ -n "$existing" && "$existing" != "$source_digest" && "$DEPLOY_ENVIRONMENT" == 'production' ]]; then
              echo 'Refusing to replace an existing production release tag with different bytes.' >&2
              exit 1
            fi
            if [[ "$existing" != "$source_digest" ]]; then
              az acr import --name "$AZURE_ACR_NAME" --source "$source" \
                --image "$repository:$TARGET_TAG" --username "$GHCR_USERNAME" --password "$GHCR_TOKEN" \
                --force --only-show-errors
            fi
            imported="$(az acr manifest show-metadata --registry "$AZURE_ACR_NAME" \
              --name "$repository:$TARGET_TAG" --query digest --output tsv)"
            [[ "$imported" == "$source_digest" ]] || { echo 'Imported manifest differs from the verified source digest.' >&2; exit 1; }
            variable=IMAGE_REF
            [[ "$repository" != kmp-live ]] || variable=LIVE_IMAGE_REF
            echo "$variable=${ACR_LOGIN_SERVER}/${repository}@${source_digest}" >> "$GITHUB_ENV"
            if [[ "$DEPLOY_ENVIRONMENT" == 'production' ]]; then
              az acr repository update --name "$AZURE_ACR_NAME" --image "$repository:$TARGET_TAG" \
                --write-enabled false --delete-enabled false --only-show-errors --output none
            fi
          done

      - name: Cut over matching live gateway before web
        id: gateway
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/kmp-aca-pre-cutover
        run: |
          set -euo pipefail
          if [[ -z "$AZURE_LIVE_APP_NAME" ]]; then
            [[ "$LIVE_UPDATES_ENABLED" != true ]] || { echo 'Enabled live delivery requires AZURE_LIVE_APP_NAME.' >&2; exit 64; }
            echo 'Gateway runtime is not enabled in this environment; its matching digest was imported.'
            exit 0
          fi
          bash deploy/azure/cutover-live-gateway.sh \
            --resource-group "$AZURE_RESOURCE_GROUP" --app "$AZURE_LIVE_APP_NAME" \
            --image "$LIVE_IMAGE_REF" --snapshot-dir "$SNAPSHOT_DIR"

      - name: Cut over worker, migrations, and web
        id: cutover
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/kmp-aca-pre-cutover
        run: |
          set -euo pipefail
          legacy_args=()
          for job in \
            "$AZURE_SCHED_HOURLY_JOB_NAME" \
            "$AZURE_SCHED_DAILY_JOB_NAME" \
            "$AZURE_SCHED_WEEKLY_JOB_NAME" \
            "$AZURE_SCHED_NIGHTLY_JOB_NAME"; do
            if [[ -n "$job" ]]; then
              legacy_args+=(--legacy-job "$job")
            fi
          done

          bash deploy/azure/cutover-unified-worker.sh \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --web-app "$AZURE_WEB_APP_NAME" \
            --migrate-job "$AZURE_MIGRATE_JOB_NAME" \
            --worker-job "$AZURE_QUEUE_JOB_NAME" \
            --admin-job "$AZURE_ADMIN_JOB_NAME" \
            --privileged-job "$AZURE_RESTORE_JOB_NAME" \
            --privileged-job "$AZURE_PROVISION_JOB_NAME" \
            --image "$IMAGE_REF" \
            --snapshot-dir "$SNAPSHOT_DIR" \
            "${legacy_args[@]}"

      - name: Restore gateway when web cutover rolls back
        if: ${{ failure() && steps.gateway.outcome == 'success' && steps.cutover.outcome == 'failure' }}
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/kmp-aca-pre-cutover
        run: |
          set -euo pipefail
          if [[ -n "$AZURE_LIVE_APP_NAME" && -s "$SNAPSHOT_DIR/live.json" ]]; then
            previous="$(jq -er '.properties.template.containers[] | select(.name == "live") | .image' "$SNAPSHOT_DIR/live.json")"
            bash deploy/azure/cutover-live-gateway.sh \
              --resource-group "$AZURE_RESOURCE_GROUP" --app "$AZURE_LIVE_APP_NAME" \
              --image "$previous" --snapshot-dir "$SNAPSHOT_DIR/gateway-rollback"
          fi

      - name: Align retained manual jobs
        run: |
          set -euo pipefail
          for job in "$AZURE_RESTORE_JOB_NAME" "$AZURE_PROVISION_JOB_NAME"; do
            if [[ -z "$job" ]]; then
              continue
            fi
            if az containerapp job show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$job" \
              --output none 2>/dev/null; then
              az containerapp job update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$job" \
                --image "$IMAGE_REF" \
                --only-show-errors \
                --output none
            else
              echo "Optional retained job does not exist: $job"
            fi
          done

      - name: Resolve deployed endpoint
        id: endpoint
        if: always()
        run: |
          FQDN="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEB_APP_NAME" \
            --query properties.configuration.ingress.fqdn \
            --output tsv 2>/dev/null || true)"
          if [[ -n "$FQDN" ]]; then
            echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve pre-cutover definitions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aca-pre-cutover-${{ inputs.environment_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/kmp-aca-pre-cutover
          if-no-files-found: warn
          retention-days: 30

      - name: Deployment summary
        if: always()
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOYED_URL: ${{ steps.endpoint.outputs.url || 'unavailable' }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Azure deployment"
            echo ""
            echo "- Environment: \`$DEPLOY_ENVIRONMENT\`"
            echo "- Source: \`$SOURCE_IMAGE\`"
            echo "- Gateway source: \`$SOURCE_LIVE_IMAGE\`"
            echo "- Gateway image: \`${LIVE_IMAGE_REF:-not imported}\`"
            echo "- Image: \`${IMAGE_REF:-not imported}\`"
            echo "- URL: $DEPLOYED_URL"
            echo "- Status: \`$DEPLOY_STATUS\`"
          } >> "$GITHUB_STEP_SUMMARY"
