# PHP uses prefork. Reserve database headroom instead of admitting hundreds of
# simultaneous platform + tenant connections from each small web replica.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    ServerLimit 128
    MaxRequestWorkers ${APACHE_MAX_REQUEST_WORKERS}
    MaxConnectionsPerChild 1000
</IfModule>
# Azure ingress/Caddy keep client connections alive. Idle backend sockets must
# release scarce prefork workers during bursts of subscription authorization.
KeepAlive Off
