title: KMP Developer Documentation
description: Architecture, development, extension, testing, and operations guides for Kingdom Management Portal.
lang: en-US
url: https://ansteorra.github.io
baseurl: /KMP
repository: Ansteorra/KMP
strict_front_matter: true
liquid:
  error_mode: strict
theme: jekyll-theme-cayman
plugins:
  - jekyll-relative-links
  - jekyll-feed
  - jekyll-github-metadata
  - jekyll-seo-tag
  - jekyll-titles-from-headings

sass:
  style: compressed

include:
  - index.md
  - LICENSE.md
  - for_kids/assets/images/
  - api/
